<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080a">
  <meta name="description" content="A simulated exchange: live order books, depth, and settlement on a synthetic esport, its matches and its statistics.">
  <title>Artificial Esports Exchange</title>

  <!-- Fonts as <link> rather than an @import inside the stylesheet. An @import
       cannot begin downloading until the CSS itself has arrived and parsed, so it
       serialises two round trips that should overlap; preconnect opens the
       connection to the font host while the CSS is still in flight. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/terminal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2308080a'/><rect x='3' y='3' width='10' height='10' fill='%23f5a623'/></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to the market</a>

  <div id="shell">
    <header>
      <h1 class="brand" translate="no">
        <span aria-hidden="true">&#9646;</span> Esports <small>Exchange</small>
      </h1>

      <!-- The header numbers change twenty times a second. Announcing every
           change would make a screen reader unusable, so the region is polite
           and only the figures a trader acts on are inside it. -->
      <div class="stats" aria-live="polite" aria-atomic="false">
        <div class="stat"><b id="clock" class="mono">0.00s</b><span>Session</span></div>
        <div class="stat"><b id="events" class="mono">0</b><span>Events</span></div>
        <div class="stat"><b id="equity" class="mono">--</b><span>Equity</span></div>
        <div class="stat"><b id="pnl" class="mono">--</b><span>P&amp;L</span></div>
      </div>

      <div class="spacer"></div>

      <!-- Who you are trading as. Every browser used to share one account, so
           two tabs were one trader: the same balance, the same blotter, and
           either able to cancel the other's orders. The name is what other
           traders see beside a fill of yours. -->
      <div class="whoami">
        <button type="button" id="whoami" class="ghost"
                title="Change the name other traders see">
          <span aria-hidden="true">&#9679;</span> <b id="whoami-name">--</b>
        </button>
      </div>

      <!-- An operator control, and it took somebody asking "why does an
           exchange have a speed slider" to notice it was on a trader's screen.
           It has no meaning on a real venue. What it actually does is set how
           fast simulated time runs against the wall clock, which is a thing
           the person running the experiment wants and a thing the person
           trading on it should never touch: a market whose clock speed is
           adjustable by whoever is long is not a market. `main.js` removes it
           on the public surface, so / runs at exactly 1x and cannot be moved
           off it. -->
      <div class="speed" id="speed-control">
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="0" max="20" step="0.5" value="1"
               aria-describedby="speed-label">
        <b id="speed-label" class="mono">1.0&times;</b>
      </div>

      <!-- Conservation is the invariant the whole ledger rests on. If it ever
           leaves zero the operator needs to know immediately, so this one is
           assertive where the rest of the header is polite. -->
      <p class="health" id="health" aria-live="assertive">
        <i aria-hidden="true"></i><span id="health-text">Conserved</span>
      </p>
    </header>

    <nav aria-label="Sections">
      <!-- Painted by `main.js` from the view registry, because which sections
           exist depends on which front end this is. `/` offers a trader the
           exchange; `/desk` offers an operator the same exchange plus the
           controls that rebuild and measure it. Writing the rail out here
           would put the answer in two places and let them disagree. -->
      <div class="nav-links" id="nav"></div>
      <div class="search">
        <label for="q" class="visually-hidden">Search markets</label>
        <input id="q" type="search" placeholder="Search markets&hellip;"
               autocomplete="off" spellcheck="false"
               aria-describedby="watch-head">
      </div>
      <h2 class="watch-head" id="watch-head">Markets</h2>
      <div class="watchlist" id="watchlist" role="list" aria-labelledby="watch-head"></div>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toaster" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
